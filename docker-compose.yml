services:
  reely:
    # Published image, so this file works copied on its own. To build from
    # source, replace with `build: .` (needs the full repo checked out).
    #
    # Pinned to an exact release so a pull can't move you to a different
    # version: upgrading means editing this tag yourself. Available tags:
    #   https://hub.docker.com/r/cajunflavoredbob/reely/tags
    image: cajunflavoredbob/reely:1.1.9
    ports:
      - "8000:8000"
    environment:
      PLEX_URL: "http://your-plex-server:32400"
      # PLEX_TOKEN comes from the secrets block below. You can drop that block
      # and pass it as an env var instead, which is less secure.
      LOG_LEVEL: INFO
      # Uncomment to enable basic auth (also uncomment auth_pass below):
      # AUTH_USER: admin
    secrets:
      - plex_token
      # - auth_pass
    volumes:
      # Optional: persist config.yaml across container restarts.
      # - ./config.yaml:/app/config.yaml:ro
      - reely_data:/app/data
    restart: unless-stopped
    # The image healthchecks /health; `docker compose ps` reports (healthy)
    # after a ~15s start period. To make another service wait for it:
    #
    #   your_service:
    #     depends_on:
    #       reely:
    #         condition: service_healthy

volumes:
  reely_data:

# Outside Swarm, Compose bind-mounts each of these into /run/secrets/ with the
# host file's owner and mode intact; the `uid`/`gid`/`mode` keys are Swarm-only
# and are ignored here. The container runs as the image's unprivileged `node`
# user (UID 1000), so a secret the host owner alone can read (`chmod 600`, or a
# file created by root) is unreadable inside and the container exits on EACCES
# in a restart loop. Make each file world-readable (`chmod 644`) or chown it to
# UID 1000. The directory needs to be traversable by that user too.
secrets:
  plex_token:
    file: ./secrets/plex_token.txt
  # auth_pass:
  #   file: ./secrets/auth_pass.txt
