# Weekly bumps for pnpm deps, Actions versions, and the Dockerfile base
# image. Grouped by ecosystem so micro-bumps don't drown the PR queue.
# No automerge: every bump is reviewed in the release batch cycle.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group minor+patch only; majors arrive as solo PRs. A mixed
      # bundle can't be cherry-picked: rejecting the major means
      # closing the PR, which drops the minors with it.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
